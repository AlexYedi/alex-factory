# Risk tiers for this repo. Read by factory-gate from the base SHA, so a PR cannot
# change the rules that judge it. Copy to .github/factory-tiers.yml and edit.
#
# Anything not listed is T2. List paths to lower their tier, never to raise it.
# This file is parsed by a strict YAML subset: block style only, and quote any
# value starting with * (so "**/x" not **/x).
version: 1

# factory-tests runs this on the PR head with no secrets. Use "true" if no tests.
tests_command: "pytest -q"

# Every file here containing the marker runs with it, on every PR.
selftest_globs:
  - "scripts/*.py"

tiers:
  # Auto-merge with no model review: text-only reference and evidence paths.
  t0:
    - "docs/reference/**"
    - "docs/evidence/**"
  # Model review, then App approval.
  t1:
    - "scripts/**"
    - "src/**"
    - "skills/**"
  # A human approves. Wins over t1 and t0. .github/**, CODEOWNERS, CLAUDE.md,
  # AGENTS.md, hooks, settings and agent definitions are T2 regardless.
  t2:
    - "scripts/lint_*.py"
    - "scripts/guard_*.py"
    - "migrations/**"

# Editable at a lower tier, but a brand-new file here is T2.
t2_new_file_globs:
  - "content/**"

# Literal strings that make a change T2 wherever they appear, e.g. skills that
# touch a human gate.
t2_if_diff_contains:
  - "needs_review"
