# Copy to .github/workflows/factory-tests.yml. Replace CORE_SHA in both places.
# Runs PR code, so it is assumed hostile: no secrets are passed, and no
# `secrets: inherit`, ever.
name: factory-tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
jobs:
  factory-tests:
    uses: AlexYedi/alex-factory/.github/workflows/tests.yml@CORE_SHA
    with:
      core_sha: CORE_SHA
