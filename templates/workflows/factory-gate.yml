# Copy to .github/workflows/factory-gate.yml. Replace CORE_SHA in both places and
# YOUR_APP_SLUG. pull_request_target takes this file from the base branch, so a
# PR cannot edit the gate that judges it.
name: factory-gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: factory-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  factory-gate:
    uses: AlexYedi/alex-factory/.github/workflows/gate.yml@CORE_SHA
    with:
      core_sha: CORE_SHA
      app_slug: YOUR_APP_SLUG
    secrets: inherit
